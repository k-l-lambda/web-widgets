name: Publish to GitHub Packages

on:
  push:
    branches:
      - master
    paths:
      - 'package.json'

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # required to publish to GitHub Packages (npm.pkg.github.com)
      id-token: write  # required for npm Trusted Publishing (OIDC) to npmjs.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit to compare

      - name: Check if version changed
        id: version-check
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Get previous version
          git show HEAD~1:package.json > /tmp/prev-package.json 2>/dev/null || echo '{"version":"0.0.0"}' > /tmp/prev-package.json
          PREV_VERSION=$(node -p "require('/tmp/prev-package.json').version")
          echo "Previous version: $PREV_VERSION"

          # Compare versions
          if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "Version changed from $PREV_VERSION to $CURRENT_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.version-check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@k-l-lambda'

      - name: Upgrade npm (Trusted Publishing requires npm >= 11.5.1)
        if: steps.version-check.outputs.changed == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.version-check.outputs.changed == 'true'
        run: npm install --legacy-peer-deps

      # Build runs once via prepublishOnly (npm run build = tsc && vite build)
      # on the first publish below; the second publish reuses the built artifacts.
      - name: Publish to npmjs.org (Trusted Publishing / OIDC)
        if: steps.version-check.outputs.changed == 'true'
        run: npm publish --provenance --access public --registry https://registry.npmjs.org

      - name: Publish to GitHub Packages
        if: steps.version-check.outputs.changed == 'true'
        run: |
          # Project-level .npmrc overrides setup-node's npmjs config, so the
          # scoped package resolves to GitHub Packages with the right auth host.
          cat > .npmrc <<'EOF'
          @k-l-lambda:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.version-check.outputs.changed == 'true'
        run: |
          echo "## 📦 Published @k-l-lambda/music-widgets@${{ steps.version-check.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- npmjs.org (Trusted Publishing)" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Packages" >> $GITHUB_STEP_SUMMARY
